<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Conozcamos sobre ti · MigraSense</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/img/favicon-32.png">
<link rel="stylesheet" href="css/style.css">
<script>
(function(){
  try{
    var t = localStorage.getItem('ms_theme');
    if(!t){ t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
</head>
<body>
<div class="app-shell no-nav wide-form">
  <div class="screen">

    <!-- Las preguntas son obligatorias: no hay opción "Más tarde" -->
    <div class="onb-header">
      <button class="back-btn" id="backBtn" aria-label="Atrás">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <span class="onb-progress-label" id="stepLabel">1 de 13</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="onb-body">
      <div class="onb-illustration" id="onbIllustration"></div>

      <div class="onb-content">
        <!-- Aquí js/onboarding.js dibuja la pregunta actual -->
        <div id="stepsHost"></div>

        <div class="onb-footer">
          <button class="btn btn-outline" id="prevBtn" style="visibility:hidden;" aria-label="Pregunta anterior">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 19l-7-7 7-7"/></svg>
          </button>
          <button class="btn btn-primary" id="nextBtn" disabled>Continuar</button>
        </div>

        <div class="dots" id="dots"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/onboarding.js"></script>
</body>
</html>
