<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Historial · MigraSense</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/img/favicon-32.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <nav class="side-nav">
    <div class="logo-sm">
      <img src="assets/img/logo-icon.png" alt="MigraSense">
      <strong>Migra<span>Sense</span></strong>
    </div>
    <a href="dashboard.html" class="nav-item" data-page="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      Inicio
    </a>
    <a href="consejos.html" class="nav-item" data-page="consejos.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11c1 .7 1 1.4 1 2h4c0-.6 0-1.3 1-2a6 6 0 0 0-3-11Z"/></svg>
      Consejos
    </a>
    <a href="historial.html" class="nav-item" data-page="historial.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5h16v14M4 9h16M9 13h6M9 16h4"/></svg>
      Historial
    </a>
    <a href="perfil.html" class="nav-item" data-page="perfil.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      Perfil
    </a>
    <div class="side-nav-footer">
      <a href="registro.html" class="btn btn-primary btn-sm" style="width:100%;">+ Registrar</a>
    </div>
  </nav>
  <div class="screen">

    <div class="topbar">
      <div>
        <h2 style="font-size:1.3rem;">Tu historial</h2>
        <p class="muted small">Todos tus registros en un solo lugar</p>
      </div>
      <button class="back-btn" id="reportBtn" title="Generar reporte">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v4M16 3v4M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/><path d="M9 14l2 2 4-4"/></svg>
      </button>
    </div>

    <div class="filter-row">
      <button class="filter-chip active" data-filter="todos">Todos</button>
      <button class="filter-chip" data-filter="prodromico">Prodrómicos</button>
      <button class="filter-chip" data-filter="episodio">Episodios</button>
    </div>

    <div id="recordsList" class="stagger-in"></div>

    <div class="empty-state" id="emptyState" style="display:none;">
      <svg class="empty-illustration" viewBox="0 0 160 160" fill="none">
        <circle cx="80" cy="80" r="72" fill="var(--accent-soft)"/>
        <rect x="46" y="52" width="68" height="60" rx="10" fill="#fff" stroke="var(--border)" stroke-width="3"/>
        <path d="M46 68h68" stroke="var(--border)" stroke-width="3"/>
        <circle cx="58" cy="60" r="3" fill="var(--accent)"/><circle cx="70" cy="60" r="3" fill="var(--accent)"/>
        <path d="M58 82h30M58 92h20" stroke="var(--border)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="106" cy="100" r="18" fill="var(--accent-strong)"/>
        <path d="M99 100h14M106 93v14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <p><strong>Todavía no hay registros</strong></p>
      <p class="small mt-8">Registra tus síntomas para empezar a ver patrones aquí.</p>
      <a href="registro.html" class="btn btn-primary mt-16" style="max-width:220px; margin:16px auto 0;">Registrar ahora</a>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item" data-page="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      Inicio
    </a>
    <a href="consejos.html" class="nav-item" data-page="consejos.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11c1 .7 1 1.4 1 2h4c0-.6 0-1.3 1-2a6 6 0 0 0-3-11Z"/></svg>
      Consejos
    </a>
    <a href="historial.html" class="nav-item" data-page="historial.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5h16v14M4 9h16M9 13h6M9 16h4"/></svg>
      Historial
    </a>
    <a href="perfil.html" class="nav-item" data-page="perfil.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      Perfil
    </a>
  </nav>
</div>

<div class="modal-overlay" id="reportModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h3 style="margin-bottom:12px;">📄 Reporte de síntomas</h3>
    <div class="textarea-wrap" style="padding:0;">
      <textarea id="reportText" readonly style="min-height:220px; padding:14px; font-size:.8rem;"></textarea>
    </div>
    <div class="btn-row mt-16">
      <button class="btn btn-outline" onclick="document.getElementById('reportModal').classList.remove('show')">Cerrar</button>
      <button class="btn btn-primary" id="downloadReportBtn">Descargar .txt</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/historial.js"></script>
</body>
</html>
